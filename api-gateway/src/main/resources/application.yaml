server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth

        # Time Tracking Service
        - id: time-tracking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/time-entries/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: timeTrackingService
                fallbackUri: forward:/fallback/time-tracking

        # Timesheet Service
        - id: timesheet-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/timesheets/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: timesheetService
                fallbackUri: forward:/fallback/timesheet

        # Billing Service
        - id: billing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/invoices/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: billingService
                fallbackUri: forward:/fallback/billing

        # Notification Service
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationService
                fallbackUri: forward:/fallback/notification

      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
