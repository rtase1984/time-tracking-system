databaseChangeLog:
  - changeSet:
      id: 001-create-time-entries-table
      author: developer
      changes:
        - createTable:
            tableName: time_entries
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: entry_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: entry_timestamp
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: ip_address
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: device_info
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: notes
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_time_entries_user_id
            tableName: time_entries
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_time_entries_user_date
            tableName: time_entries
            columns:
              - column:
                  name: user_id
              - column:
                  name: entry_timestamp

        - createIndex:
            indexName: idx_time_entries_entry_type
            tableName: time_entries
            columns:
              - column:
                  name: entry_type

        - createIndex:
            indexName: idx_time_entries_timestamp
            tableName: time_entries
            columns:
              - column:
                  name: entry_timestamp

        - addCheckConstraint:
            constraintName: chk_entry_type
            tableName: time_entries
            checkConstraint: entry_type IN ('CHECK_IN', 'CHECK_OUT', 'BREAK_START', 'BREAK_END')

      rollback:
        - dropTable:
            tableName: time_entries