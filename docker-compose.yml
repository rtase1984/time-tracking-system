version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: time-tracking-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: timetracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - time-tracking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: time-tracking-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    networks:
      - time-tracking-network

  redis:
    image: redis:7-alpine
    container_name: time-tracking-redis
    ports:
      - "6379:6379"
    networks:
      - time-tracking-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: time-tracking-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - time-tracking-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: time-tracking-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - time-tracking-network

  maildev:
    image: maildev/maildev
    container_name: time-tracking-maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    networks:
      - time-tracking-network

  zipkin:
    image: openzipkin/zipkin
    container_name: time-tracking-zipkin
    ports:
      - "9411:9411"
    networks:
      - time-tracking-network

  # Microservices

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/timetracking
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - time-tracking-network

  billing-service:
    build: ./billing-service
    container_name: billing-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://admin:password@mongo:27017/billing_db?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - mongo
      - kafka
    networks:
      - time-tracking-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_MAIL_HOST=maildev
      - SPRING_MAIL_PORT=1025
    depends_on:
      - kafka
      - maildev
    networks:
      - time-tracking-network

  time-sheet-service:
    build: ./time-sheet-service
    container_name: timesheet-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/timetracking
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - time-tracking-network

  time-tracking-service:
    build: ./time-tracking-service
    container_name: time-tracking-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/timetracking
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - time-tracking-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=redis
      # URI de los servicios para el Gateway (usando nombres de servicio docker)
      - APP_AUTH_SERVICE_URL=http://auth-service:8081
      - APP_BILLING_SERVICE_URL=http://billing-service:8082
      - APP_NOTIFICATION_SERVICE_URL=http://notification-service:8083
      - APP_TIMESHEET_SERVICE_URL=http://timesheet-service:8084
      - APP_TIME_TRACKING_SERVICE_URL=http://time-tracking-service:8085
    depends_on:
      - auth-service
      - time-tracking-service
      - postgres
      - redis
    networks:
      - time-tracking-network

networks:
  time-tracking-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
